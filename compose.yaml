services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: games
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-games}
      POSTGRES_DB: games
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on loopback so cargo, psql and sqlx-cli on the host can reach it.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U games -d games"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://games:${POSTGRES_PASSWORD:-games}@db:5432/games
      BIND_ADDR: 0.0.0.0:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
