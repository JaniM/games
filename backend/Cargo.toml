[package]
name = "games-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.1", features = ["serde"] }

[dev-dependencies]
serde_json = "1.0.154"
tower = { version = "0.5.3", features = ["util"] }
